[project]
name = "braintumorproject"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imagehash>=4.3.2",
    "kagglehub>=1.0.2",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "numpy>=2,<3",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "monai==1.6.0",
    "pandas",
    "matplotlib",
    "scikit-image",
    "pydicom",
    "nibabel",
    "mlflow>=3,<3.13",
    "psutil",
    "ipykernel",
    "pytest",
    "ruff",
    "xgboost==3.1.2",
    "h5py>=3.16.0",
    "pyside6>=6.11.2",
    "pytest-qt>=4.5.0",
    "reportlab>=5.0.1",
    "pypdf>=6.19.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
